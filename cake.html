<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Birthday Cake 💗</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">

    <style>

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 190, 220, .8),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(210, 180, 255, .7),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #ffd8e8,
                    #f5d9ff,
                    #ffe5f0
                );

            position: relative;
        }


        /* HEART BACKGROUND */

        .hearts-background {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .hearts-background span {

            position: absolute;

            bottom: -40px;

            font-size: 20px;

            opacity: .65;

            animation:
                heartFlow 8s linear infinite;
        }


        .hearts-background span:nth-child(1) {
            left: 5%;
            animation-delay: 0s;
        }

        .hearts-background span:nth-child(2) {
            left: 15%;
            animation-delay: 2s;
        }

        .hearts-background span:nth-child(3) {
            left: 28%;
            animation-delay: 4s;
        }

        .hearts-background span:nth-child(4) {
            left: 42%;
            animation-delay: 1s;
        }

        .hearts-background span:nth-child(5) {
            left: 55%;
            animation-delay: 3s;
        }

        .hearts-background span:nth-child(6) {
            left: 68%;
            animation-delay: 5s;
        }

        .hearts-background span:nth-child(7) {
            left: 80%;
            animation-delay: 2.5s;
        }

        .hearts-background span:nth-child(8) {
            left: 92%;
            animation-delay: 4.5s;
        }


        @keyframes heartFlow {

            0% {
                transform:
                    translateY(0)
                    scale(.7)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: .7;
            }

            50% {

                transform:
                    translateY(-50vh)
                    translateX(25px)
                    scale(1)
                    rotate(12deg);

            }

            100% {

                transform:
                    translateY(-115vh)
                    translateX(-25px)
                    scale(1.2)
                    rotate(-15deg);

                opacity: 0;
            }
        }


        /* MAIN BOX */

        .cake-page {

            width: 90%;

            max-width: 700px;

            height: 88vh;

            max-height: 90vh;

            padding: 20px;

            box-sizing: border-box;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            background:
                rgba(255,255,255,.52);

            border:
                1px solid
                rgba(255,255,255,.85);

            border-radius: 35px;

            box-shadow:
                0 20px 50px
                rgba(160,70,120,.2);

            backdrop-filter:
                blur(15px);

            position: relative;

            z-index: 2;

            overflow: hidden;
        }


        .top-hearts {

            font-size: 23px;

            letter-spacing: 7px;

            animation:
                topHeart 2s ease-in-out infinite;
        }


        h1 {

            font-family:
                Georgia,
                serif;

            font-style: italic;

            font-size:
                clamp(29px,5vw,44px);

            margin:
                5px 0;

            color: #8f3c67;
        }


        .subtitle {

            font-size: 13px;

            color: #76596b;

            margin:
                2px 0 10px;
        }


        /* PANDA CAKE IMAGE */

        .cake-image-area {

            position: relative;

            width: 300px;

            height: 260px;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .cake-image {

            width: 270px;

            max-height: 245px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 12px 15px
                    rgba(130,60,100,.18)
                );

            transition:
                transform .8s ease;
        }


        /* KNIFE */

        .knife {

            position: absolute;

            right: 5px;

            top: 35px;

            font-size: 52px;

            transform:
                rotate(-35deg);

            z-index: 5;

            opacity: 0;

            transition:
                all 1.1s ease;
        }


        /* CUT LINE */

        .cut-line {

            position: absolute;

            width: 5px;

            height: 0;

            background:
                rgba(255,255,255,.9);

            border-radius: 10px;

            top: 45px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 6;

            box-shadow:
                0 0 10px
                rgba(255,120,170,.8);

            transition:
                height .7s ease;
        }


        /* CUT ANIMATION */

        .cutting .knife {

            opacity: 1;

            right: 100px;

            top: 95px;

            transform:
                rotate(35deg);
        }


        .cutting .cake-image {

            transform:
                scale(.96);
        }


        .cutting .cut-line {

            height: 105px;
        }


        /* MESSAGE */

        .wish-text {

            font-family:
                Georgia,
                serif;

            font-style: italic;

            font-size: 16px;

            color: #a13f70;

            margin:
                4px 0 13px;
        }


        /* BUTTON */

        .cut-button,
        .next-button {

            border: none;

            border-radius: 28px;

            padding:
                11px 24px;

            color: white;

            font-size: 12px;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #ff86b7,
                    #c49aff
                );

            box-shadow:
                0 8px 22px
                rgba(180,80,140,.23);

            transition:
                transform .3s ease;
        }


        .cut-button:hover,
        .next-button:hover {

            transform:
                translateY(-3px)
                scale(1.04);
        }


        .next-button {

            display: none;

            margin-top: 10px;
        }


        .next-button.show {

            display: block;

            animation:
                appear .6s ease;
        }


        /* CELEBRATION */

        .celebration {

            position: absolute;

            inset: 0;

            pointer-events: none;

            z-index: 10;
        }


        .celebration span {

            position: absolute;

            top: -30px;

            font-size: 22px;

            opacity: 0;
        }


        .celebrate .celebration span {

            opacity: 1;

            animation:
                celebrateFall 3s linear infinite;
        }


        .celebration span:nth-child(1) {
            left: 8%;
        }

        .celebration span:nth-child(2) {
            left: 25%;
            animation-delay: .3s;
        }

        .celebration span:nth-child(3) {
            left: 45%;
            animation-delay: .6s;
        }

        .celebration span:nth-child(4) {
            left: 65%;
            animation-delay: .9s;
        }

        .celebration span:nth-child(5) {
            left: 85%;
            animation-delay: 1.2s;
        }


        @keyframes celebrateFall {

            from {

                transform:
                    translateY(-30px)
                    rotate(0);

            }

            to {

                transform:
                    translateY(100vh)
                    rotate(360deg);

            }
        }


        @keyframes topHeart {

            0%,100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }


        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(12px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }
        }


        /* MOBILE */

        @media (max-width:600px) {

            .cake-page {

                width: 94%;

                height: 90vh;

                padding:
                    15px 10px;
            }


            .top-hearts {

                font-size: 18px;

            }


            h1 {

                font-size: 28px;

            }


            .subtitle {

                font-size: 10px;

            }


            .cake-image-area {

                width: 270px;

                height: 225px;

            }


            .cake-image {

                width: 235px;

                max-height: 210px;

            }


            .knife {

                font-size: 43px;

            }


            .cutting .knife {

                right: 90px;

                top: 85px;

            }


            .cutting .cut-line {

                height: 85px;

            }


            .wish-text {

                font-size: 13px;

            }


            .cut-button,
            .next-button {

                font-size: 10px;

                padding:
                    9px 18px;

            }

        }

    </style>

</head>


<body>
    <div class="love-bg">
    <span>❤️</span>
    <span>💕</span>
    <span>💜</span>
    <span>😘</span>
    <span>💋</span>
    <span>💖</span>
    <span>💕</span>
    <span>❤️</span>
    <span>💜</span>
    <span>😘</span>
</div>


    <!-- FLOWING HEARTS -->

    <div class="hearts-background">

        <span>💗</span>
        <span>💕</span>
        <span>💖</span>
        <span>💗</span>
        <span>💞</span>
        <span>💓</span>
        <span>💕</span>
        <span>💖</span>

    </div>


    <div
        class="cake-page"
        id="cakePage">


        <!-- CELEBRATION -->

        <div class="celebration">

            <span>💖</span>
            <span>🎉</span>
            <span>✨</span>
            <span>💕</span>
            <span>🎀</span>

        </div>


        <div class="top-hearts">

            💗 ✨ 💕 ✨ 💗

        </div>


        <h1>

            A Special Cake For You 🎂

        </h1>


        <p class="subtitle">

            Even Panda came with a little birthday surprise 🐼💖

        </p>


        <!-- CAKE -->

        <div
            class="cake-image-area"
            id="cakeArea">


            <img
                src="images/panda-cake.png"
                class="cake-image"
                id="cakeImage"
                alt="Panda Birthday Cake">


            <div
                class="cut-line"
                id="cutLine">
            </div>


            <div
                class="knife"
                id="knife">

                🔪

            </div>

        </div>


        <p class="wish-text">

            Make a wish... then let's cut the cake together 💗

        </p>


        <button
            class="cut-button"
            id="cutButton"
            onclick="cutCake()">

            🎂 Cut The Cake My Girl 💕
        </button>


        <button
            class="next-button"
            id="nextButton"
            onclick="window.location.href='memories.html'">

            Continue You want to see a surprise💌

        </button>


    </div>


    <script>

        function cutCake() {

            const page =
                document.getElementById(
                    "cakePage"
                );

            const button =
                document.getElementById(
                    "cutButton"
                );

            const next =
                document.getElementById(
                    "nextButton"
                );


            page.classList.add(
                "cutting"
            );


            setTimeout(function () {

                page.classList.add(
                    "celebrate"
                );

                button.innerHTML =
                    "🎉 Cake Cut! Happy Birthday! 💖";

                button.disabled =
                    true;

            }, 1000);


            setTimeout(function () {

                next.classList.add(
                    "show"
                );

            }, 1600);

        }

    </script>


</body>

</html>
