<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Little Memories 📸</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">

    <style>

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .memories-container {
            width: 92%;
            max-width: 760px;
            height: 88vh;
            max-height: 90vh;

            padding: 20px;

            box-sizing: border-box;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            background: transparent;
            border: none;
            border-radius: 30px;

            box-shadow: 0 18px 45px rgba(130, 70, 110, 0.18);

            backdrop-filter: blur(14px);

            overflow: hidden;
        }

        .memory-cartoon {
            font-size: 38px;

            animation: memoryFloat 2.5s ease-in-out infinite;
        }

        .memories-container h1 {
            font-family: Georgia, serif;
            font-style: italic;

            font-size: clamp(27px, 5vw, 40px);

            margin: 3px 0 3px;
        }

        .memory-subtitle {
            font-size: 12px;

            margin: 0 0 14px;
        }


        /* PHOTO GRID */

        .photo-grid {
            width: 92%;

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 12px;

            margin-bottom: 14px;
        }

        .photo-card {
            position: relative;

            height: 145px;

            padding: 6px;

            background: rgba(255, 255, 255, 0.7);

            border-radius: 18px;

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .photo-card:hover {
            transform: translateY(-5px) rotate(1deg);

            box-shadow:
                0 10px 25px rgba(160, 70, 120, 0.2);
        }

        .photo-card img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 13px;

            display: block;
        }

        .photo-label {
            position: absolute;

            bottom: 10px;
            left: 50%;

            transform: translateX(-50%);

            padding: 4px 9px;

            border-radius: 12px;

            background: rgba(60, 20, 80, 0.85);

            font-size: 9px;

            white-space: nowrap;
        }


        /* POPUP */

        .photo-popup {
            display: none;

            position: fixed;

            inset: 0;

            z-index: 1000;

            background: rgba(50, 30, 50, 0.72);

            justify-content: center;
            align-items: center;

            padding: 20px;

            box-sizing: border-box;
        }

        .photo-popup.show {
            display: flex;
        }

        .popup-content {
            position: relative;

            max-width: 85%;
            max-height: 80%;

            animation: popupOpen 0.35s ease;
        }

        .popup-content img {
            max-width: 100%;
            max-height: 70vh;

            border-radius: 22px;

            display: block;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.3);
        }

        .close-popup {
            position: absolute;

            top: -15px;
            right: -15px;

            width: 34px;
            height: 34px;

            border: none;

            border-radius: 50%;

            background: white;

            font-size: 18px;

            cursor: pointer;
        }


        /* BUTTON */

        .memory-next {
            padding: 10px 22px;

            border: none;

            border-radius: 25px;

            background:
                linear-gradient(
                    135deg,
                    #ff9fc5,
                    #cda5ff
                );

            color: white;

            font-size: 12px;

            cursor: pointer;
        }


        /* ANIMATIONS */

        @keyframes memoryFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes popupOpen {

            from {
                opacity: 0;
                transform: scale(0.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .memories-container {
                width: 94%;
                height: 90vh;

                padding: 14px 10px;
            }

            .memory-cartoon {
                font-size: 30px;
            }

            .memories-container h1 {
                font-size: 26px;
            }

            .memory-subtitle {
                font-size: 10px;
                margin-bottom: 10px;
            }

            .photo-grid {
                width: 96%;
                gap: 7px;
            }

            .photo-card {
                height: 105px;
                padding: 4px;
            }

            .photo-label {
                font-size: 7px;
                bottom: 6px;
            }

            .memory-next {
                font-size: 10px;
                padding: 9px 18px;
            }
        }

    </style>

</head>


<body>
    <div class="love-bg">
    <span>❤️</span>
    <span>💕</span>
    <span>💜</span>
    <span>😘</span>
    <span>💋</span>
    <span>💖</span>
    <span>💕</span>
    <span>❤️</span>
    <span>💜</span>
    <span>😘</span>
</div>

    <div class="memories-container">

        <div class="memory-cartoon">
            🧸📸💕
        </div>

        <h1>
            Our Little Memories ✨
        </h1>

        <p class="memory-subtitle">
            Every picture holds a little moment worth remembering 💖
        </p>


        <div class="photo-grid">

            <!-- PHOTO 1 -->
            <div
                class="photo-card"
                onclick="openPhoto('images/photo1.jpeg')">

                <img
                    src="images/photo1.jpeg"
                    alt="Memory 1">

                <span class="photo-label">
                    A Little Memory 💕
                </span>

            </div>


            <!-- PHOTO 2 -->
            <div
                class="photo-card"
                onclick="openPhoto('images/photo2.jpeg')">

                <img
                    src="images/photo2.jpeg"
                    alt="Memory 2">

                <span class="photo-label">
                    Sweet Moment 🌸
                </span>

            </div>


            <!-- PHOTO 3 -->
            <div
                class="photo-card"
                onclick="openPhoto('images/photo3.jpeg')">

                <img
                    src="images/photo3.jpeg"
                    alt="Memory 3">

                <span class="photo-label">
                    Special Day ✨
                </span>

            </div>


            <!-- PHOTO 4 -->
            <div
                class="photo-card"
                onclick="openPhoto('images/photo4.jpeg')">

                <img
                    src="images/photo4.jpeg"
                    alt="Memory 4">

                <span class="photo-label">
                    Beautiful Memory 💖
                </span>

            </div>


            <!-- PHOTO 5 -->
            <div
                class="photo-card"
                onclick="openPhoto('images/photo5.jpeg')">

                <img
                    src="images/photo5.jpeg"
                    alt="Memory 5">

                <span class="photo-label">
                    Forever Moment 🧸
                </span>

            </div>


            <!-- PHOTO 6 -->
            <div
                class="photo-card"
                onclick="openPhoto('images/photo6.jpeg')">

                <img
                    src="images/photo6.jpeg"
                    alt="Memory 6">

                <span class="photo-label">
                    One More Smile 💗
                </span>

            </div>

        </div>


        <button
            class="memory-next"
            onclick="window.location.href='special.html'">

            Continue Bubbly🎀🐣

        </button>

    </div>


    <!-- PHOTO POPUP -->

    <div
        id="photoPopup"
        class="photo-popup"
        onclick="closePhoto()">

        <div
            class="popup-content"
            onclick="event.stopPropagation()">

            <button
                class="close-popup"
                onclick="closePhoto()">

                ×

            </button>

            <img
                id="popupImage"
                src=""
                alt="Selected Memory">

        </div>

    </div>


    <script>

        function openPhoto(imagePath) {

            document.getElementById("popupImage").src =
                imagePath;

            document.getElementById("photoPopup")
                .classList.add("show");
        }


        function closePhoto() {

            document.getElementById("photoPopup")
                .classList.remove("show");
        }

    </script>

</body>

</html>
